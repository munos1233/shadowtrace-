[project]
name = "shadowtrace-backend"
version = "0.1.0"
description = "ShadowTrace FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "redis>=5.2.0",
  "orjson>=3.10.0",
  "jsonschema>=4.26.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "alembic>=1.14.0",
  "httpx>=0.28.0",
  "pgvector>=0.4.0",
  "python-socketio[asyncio_client]>=5.12.0",
  "jinja2>=3.1.0",
  "langgraph>=0.2.0",
  "langgraph-checkpoint>=2.0.0,<4.0.0",
  "celery>=5.4.0",
  "opensearch-py>=2.7.0",
  "neo4j>=5.27.0",
  "opentelemetry-api>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-exporter-otlp-proto-http>=1.27.0",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-httpx>=0.48b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
  "opentelemetry-instrumentation-celery>=0.48b0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "respx>=0.22.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "PyYAML>=6.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not opensearch and not neo4j and not system and not regression and not baseline_refresh and not autonomous_mock_e2e and not adversarial_audit'"
markers = [
  "integration: requires real PostgreSQL and Redis services",
  "adversarial_audit: optional local full-loop quality gate (ISSUE-203; long-running)",
  "tool_system: Registry/Executor/Mock tool-system integration chains (ISSUE-025)",
  "rag: RAG + risk scoring integration (ISSUE-047)",
  "e2e_basic: analysis-only golden-path integration (ISSUE-039)",
  "orchestration: multi-agent orchestration integration (ISSUE-055)",
  "e2e_response: end-to-end response-loop integration (ISSUE-064)",
  "system: full-system quality gate (ISSUE-086; requires PostgreSQL + Redis)",
  "regression: golden-path snapshot regression gate (ISSUE-087; requires PostgreSQL + Redis)",
  "baseline_refresh: explicit baseline overwrite (ISSUE-087; UPDATE_BASELINE=1 only)",
  "evaluation: evaluation pipeline gate (ISSUE-105; requires PostgreSQL)",
  "autonomous_mock_e2e: ISSUE-110 full-loop E2E with live Celery worker (make up WORKER=1)",
  "worker_crash_fault_injection: ISSUE-283 real worker SIGKILL redelivery gate",
  "unit: pure unit tests with no external services",
  "opensearch: requires OpenSearch service (ISSUE-084)",
  "neo4j: requires Neo4j service (docker compose --profile optional up -d neo4j)",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic writes verbose autogenerated revisions; keep them out of lint.
extend-exclude = ["migrations/versions", "app/core/llm/golden"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# FastAPI `Depends(...)` defaults are idiomatic; B008 is noisy inside route factories.
[tool.ruff.lint.per-file-ignores]
"app/mock_xdr/api.py" = ["B008"]
"app/api/v1/events.py" = ["B008"]
"app/api/v1/source_records.py" = ["B008"]
"app/api/v1/trajectory.py" = ["B008"]
"app/models/__init__.py" = ["I001"]  # evaluation_run before evaluation_quality (circular import)
"tests/conftest.py" = ["E402"]
"tests/integration/integration_fixtures.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
packages = ["app"]
