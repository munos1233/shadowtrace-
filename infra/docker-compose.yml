# ============================================================================
# ShadowTrace docker-compose — one-command deployment (ISSUE-088)
#
# Core services (no profile):
#   postgres  redis  mock-xdr  backend  frontend
#
# DB migrations (ISSUE-238): only ``backend`` runs ``alembic upgrade head`` via
# ``docker-entrypoint.sh``. Celery workers / beat / mock-xdr set
# ``SKIP_DB_MIGRATE=true`` and ``depends_on: backend: service_healthy`` so they
# never race on ``alembic_version`` during parallel first boot.
#
# Optional profiles:
#   --profile worker     Celery investigation worker
#   --profile scheduler  Celery Beat + ingestion worker (ISSUE-107)
#   --profile demo       Full mock demo: worker + scheduler (+ observability via make up-demo)
#   --profile optional   OpenSearch + Neo4j
# Live mode: copy infra/.env.live.example → ../.env.live (compose auto-loads when present)
#
# Usage:
#   make up                # start core services
#   make up WORKER=1       # start with Celery investigation worker
#   make up-demo           # core + worker + scheduler + observability (ISSUE-141)
#   make bootstrap         # migrate + seed demo data (+ ensure playbook release)
#   make down              # stop everything, keep volumes
#
# Playbook readiness (ISSUE-245 / #820):
#   Backend entrypoint seeds + activates data/knowledge/playbooks.json when
#   SEED_PLAYBOOK_RELEASE=true (Compose default) so health.playbook_resources
#   is ready before traffic. Demo profile also sets PLAYBOOK_REQUIRED=true
#   (health 503 if not ready). Investigation stack stays fail-soft.
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # PostgreSQL 16 + pgvector — required, always started
  # --------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: shadowtrace
      POSTGRES_PASSWORD: shadowtrace
      POSTGRES_DB: shadowtrace
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - shadowtrace_pgdata:/var/lib/postgresql/data
      - ./postgres/init-vector.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shadowtrace -d shadowtrace"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --------------------------------------------------------------------------
  # Redis 7 — required, always started
  # --------------------------------------------------------------------------
  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --------------------------------------------------------------------------
  # Mock XDR — standalone source + disposition simulator (ISSUE-088)
  # Provides /mock-xdr/v1 read & write endpoints for the demo loop.
  # --------------------------------------------------------------------------
  mock-xdr:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      SKIP_DB_MIGRATE: "true"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["python", "-m", "uvicorn"]
    command:
      [
        "app.mock_xdr.api:app",
        "--host", "0.0.0.0",
        "--port", "8100",
        "--log-level", "info",
      ]
    ports:
      - "${MOCK_XDR_PORT:-8100}:8100"
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:8100/mock-xdr/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --------------------------------------------------------------------------
  # Backend — FastAPI + Socket.IO (ISSUE-088)
  #
  # Default: full-mock mode — no external XDR, LLM, or GPU required.
  # Live overrides: optional ../.env.live (see infra/.env.live.example).
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - ../.env.example
      - path: ../.env.live
        required: false
    environment:
      # --- Database & cache ---
      DATABASE_URL: postgresql+asyncpg://shadowtrace:shadowtrace@postgres:5432/shadowtrace
      REDIS_URL: redis://redis:6379/0

      # --- Mock mode defaults (ISSUE-088 §实现步骤 point 2) ---
      SOURCE_MODE: mock_xdr
      DISPOSITION_MODE: mock_xdr
      TOOL_MODE: mock
      SIMULATION_ENABLED: "true"
      TASK_MODE: ${TASK_MODE:-background}
      CELERY_BROKER_URL: redis://redis:6379/0

      # --- Mock XDR connection ---
      DISPOSITION_BASE_URL: http://mock-xdr:8100

      # --- Safety gates (live mode only) ---
      ALLOW_LIVE_SIDE_EFFECTS: "false"
      ALLOW_XDR_WRITEBACK: "false"

      # --- Dev auth (ISSUE-088 bootstrap + ISSUE-077 e2e compatibility) ---
      # bootstrap-token: all roles incl. admin — bootstrap/force-close escape hatch only.
      # e2e-token: analyst+approver — daily demo/E2E without admin (ISSUE-308).
      DEV_AUTH_TOKENS: '{"bootstrap-token":{"subject":"bootstrap","roles":["analyst","admin","approver","disposition_operator"],"tenant_id":"tenant-a"},"e2e-token":{"subject":"e2e-operator","display_name":"E2E Operator","roles":["analyst","approver"],"tenant_id":"tenant-a"}}'

      # --- Playbook release seed + demo health gate (ISSUE-245 / #820) ---
      # Backend owns seed (entrypoint after alembic). Workers must not set this.
      SEED_PLAYBOOK_RELEASE: ${SEED_PLAYBOOK_RELEASE:-true}
      # Demo/ops gate only — does not refuse investigations (fail-soft retained).
      PLAYBOOK_REQUIRED: ${PLAYBOOK_REQUIRED:-false}

      # --- Org change-window baseline (ISSUE-313 / ISSUE-114) ---
      CHANGE_WINDOW_BASELINE_PATH: /app/data/organization/change_windows.json

      # --- Optional graph mirror (override host default when neo4j profile is on) ---
      NEO4J_URI: bolt://neo4j:7687

      # Optional OTel (ISSUE-092): point at host collector when observability stack runs locally
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}
      OTEL_SERVICE_NAME: shadowtrace-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-xdr:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      # Playbook seed adds a few seconds after migrate on cold volumes.
      start_period: 90s

  # --------------------------------------------------------------------------
  # Frontend — React SPA served by nginx with /api + /socket.io proxy
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # ISSUE-221: dev token is explicit here — not baked into the Dockerfile default.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-}
        VITE_DEV_AUTH_TOKEN: ${VITE_DEV_AUTH_TOKEN:-e2e-token}
        VITE_AUTH_SUBJECT: ${VITE_AUTH_SUBJECT:-bootstrap}
        VITE_APPROVER_DISPLAY: ${VITE_APPROVER_DISPLAY:-Bootstrap Operator}
        VITE_EVENT_CHAT_ENABLED: ${VITE_EVENT_CHAT_ENABLED:-true}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
      mock-xdr:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ==========================================================================
  # Optional profiles
  # ==========================================================================

  # --------------------------------------------------------------------------
  # Celery worker — async investigation execution
  #   docker compose --profile worker up -d
  # Migrations: SKIP_DB_MIGRATE — backend owns alembic (ISSUE-238).
  # --------------------------------------------------------------------------
  worker:
    profiles: ["worker", "demo"]
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - ../.env.example
      - path: ../.env.live
        required: false
    environment:
      SKIP_DB_MIGRATE: "true"
      DATABASE_URL: postgresql+asyncpg://shadowtrace:shadowtrace@postgres:5432/shadowtrace
      REDIS_URL: redis://redis:6379/0
      SOURCE_MODE: mock_xdr
      DISPOSITION_MODE: mock_xdr
      TOOL_MODE: mock
      SIMULATION_ENABLED: "true"
      ALLOW_LIVE_SIDE_EFFECTS: "false"
      ALLOW_XDR_WRITEBACK: "false"
      DISPOSITION_BASE_URL: http://mock-xdr:8100
      TASK_MODE: celery
      CELERY_BROKER_URL: redis://redis:6379/0
      CHANGE_WINDOW_BASELINE_PATH: /app/data/organization/change_windows.json
      # Backend owns migrate + playbook seed (ISSUE-245).
      SEED_PLAYBOOK_RELEASE: "false"
      # Optional OTel (ISSUE-092): point at host collector when observability stack runs locally
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}
      OTEL_SERVICE_NAME: shadowtrace-worker
    command:
      [
        "python", "-m", "celery",
        "-A", "app.core.celery_app",
        "worker",
        "-Q", "investigation",
        "-n", "investigation@%h",
        "-c", "2",
        "--prefetch-multiplier=1",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -m celery -A app.core.celery_app inspect ping -d investigation@$(hostname) -t 3 | grep -q OK",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-xdr:
        condition: service_healthy
      backend:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # Ingestion scheduler — Celery Beat + dedicated ingestion worker (ISSUE-107)
  #   docker compose --profile scheduler up -d
  #   make up SCHEDULER=1
  # Requires INGESTION_SCHEDULER_ENABLED=true (set below); does NOT use -B on
  # the investigation worker profile.
  # BEHAVIOR_OBSERVATION_RETRY_ENABLED=true on beat schedules projection retry
  # (ISSUE-156). scheduler-worker only consumes the ingestion queue — it does
  # not need the retry env flag; beat owns the schedule. Restart scheduler-beat
  # after changing BEHAVIOR_OBSERVATION_RETRY_* or related beat schedule flags.
  # --------------------------------------------------------------------------
  scheduler-beat:
    profiles: ["scheduler", "demo"]
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - ../.env.example
      - path: ../.env.live
        required: false
    environment:
      SKIP_DB_MIGRATE: "true"
      DATABASE_URL: postgresql+asyncpg://shadowtrace:shadowtrace@postgres:5432/shadowtrace
      REDIS_URL: redis://redis:6379/0
      SOURCE_MODE: mock_xdr
      DISPOSITION_MODE: mock_xdr
      DISPOSITION_BASE_URL: http://mock-xdr:8100
      CHANGE_WINDOW_BASELINE_PATH: /app/data/organization/change_windows.json
      SIMULATION_ENABLED: "true"
      INGESTION_SCHEDULER_ENABLED: "true"
      INGESTION_POLL_INTERVAL_S: ${INGESTION_POLL_INTERVAL_S:-60}
      BEHAVIOR_OBSERVATION_RETRY_ENABLED: "true"
      BEHAVIOR_OBSERVATION_RETRY_INTERVAL_S: ${BEHAVIOR_OBSERVATION_RETRY_INTERVAL_S:-120}
      TASK_MODE: celery
      CELERY_BROKER_URL: redis://redis:6379/0
      # Backend owns migrate + playbook seed (ISSUE-245).
      SEED_PLAYBOOK_RELEASE: "false"
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}
      OTEL_SERVICE_NAME: shadowtrace-scheduler-beat
    command:
      [
        "python", "-m", "celery",
        "-A", "app.core.celery_app",
        "beat",
        "--loglevel", "info",
        "--pidfile", "/tmp/celerybeat.pid",
        "--schedule", "/tmp/celerybeat-schedule",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /tmp/celerybeat.pid && kill -0 \"$(cat /tmp/celerybeat.pid)\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-xdr:
        condition: service_healthy
      backend:
        condition: service_healthy

  scheduler-worker:
    profiles: ["scheduler", "demo"]
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - ../.env.example
      - path: ../.env.live
        required: false
    environment:
      SKIP_DB_MIGRATE: "true"
      DATABASE_URL: postgresql+asyncpg://shadowtrace:shadowtrace@postgres:5432/shadowtrace
      REDIS_URL: redis://redis:6379/0
      SOURCE_MODE: mock_xdr
      DISPOSITION_MODE: mock_xdr
      TOOL_MODE: mock
      SIMULATION_ENABLED: "true"
      ALLOW_LIVE_SIDE_EFFECTS: "false"
      ALLOW_XDR_WRITEBACK: "false"
      DISPOSITION_BASE_URL: http://mock-xdr:8100
      CHANGE_WINDOW_BASELINE_PATH: /app/data/organization/change_windows.json
      INGESTION_SCHEDULER_ENABLED: "true"
      INGESTION_POLL_INTERVAL_S: ${INGESTION_POLL_INTERVAL_S:-60}
      CELERY_BROKER_URL: redis://redis:6379/0
      # Backend owns migrate + playbook seed (ISSUE-245).
      SEED_PLAYBOOK_RELEASE: "false"
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}
      OTEL_SERVICE_NAME: shadowtrace-scheduler-worker
    command:
      [
        "python", "-m", "celery",
        "-A", "app.core.celery_app",
        "worker",
        "-Q", "ingestion",
        "-n", "ingestion-scheduler@%h",
        "-c", "1",
        "--prefetch-multiplier=1",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -m celery -A app.core.celery_app inspect ping -d ingestion-scheduler@$(hostname) -t 3 | grep -q OK",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-xdr:
        condition: service_healthy
      backend:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # OpenSearch — full-text search backend (ISSUE-084)
  #   docker compose --profile optional up -d opensearch
  # --------------------------------------------------------------------------
  opensearch:
    profiles: ["optional"]
    image: opensearchproject/opensearch:2.17.0
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_SECURITY_PLUGIN: "true"
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    ulimits:
      memlock:
        soft: -1
        hard: -1

  # --------------------------------------------------------------------------
  # Neo4j — graph mirror backend (ISSUE-082)
  #   docker compose --profile optional up -d neo4j
  # --------------------------------------------------------------------------
  neo4j:
    profiles: ["optional"]
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/shadowtrace
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  shadowtrace_pgdata:
  opensearch_data:
  neo4j_data:
  neo4j_logs:
