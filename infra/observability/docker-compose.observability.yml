# Optional observability stack (ISSUE-092 / ISSUE-141 demo via ``make up-demo``).
#
# Standalone:
#   make up-observability
#
# Full mock demo (app + worker + scheduler + this stack):
#   make up-demo
#
# Bind-mount sources must NOT use bare ``./file`` when this file is merged as
# the second ``-f`` after ``infra/docker-compose.yml``. Compose resolves
# relative binds against the first file's directory (``infra/``), which
# creates empty host directories and fails runc with "not a directory".
# ``OBSERVABILITY_CONFIG_DIR`` is set by Makefile; default ``.`` keeps
# standalone ``-f infra/observability/docker-compose.observability.yml``.

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ${OBSERVABILITY_CONFIG_DIR:-.}/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "${OTEL_HTTP_PORT:-4318}:4318"
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_PROMETHEUS_PORT:-8889}:8889"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ${OBSERVABILITY_CONFIG_DIR:-.}/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - otel-collector
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: shadowtrace
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ${OBSERVABILITY_CONFIG_DIR:-.}/grafana-dashboard.json:/var/lib/grafana/dashboards/shadowtrace-writeback.json:ro
      - ${OBSERVABILITY_CONFIG_DIR:-.}/grafana-provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
