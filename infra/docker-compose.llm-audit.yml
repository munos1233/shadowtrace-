# Judge/audit runtime: real LLM with the complete Canonical Mock closure.
#
# Use with infra/docker-compose.yml + docker-compose.worker.yml. Provider modes
# are pinned here so a stale .env.live cannot accidentally route a judge demo
# to an unavailable production XDR. Only LLM_* values come from the local,
# gitignored .env.llm.audit file.
services:
  backend:
    env_file:
      - path: ../.env.llm.audit
        required: true
    environment:
      TASK_MODE: celery
      SOURCE_MODE: mock_xdr
      DISPOSITION_MODE: mock_xdr
      DISPOSITION_ADAPTER_KIND: mock
      TOOL_MODE: mock
      SIMULATION_ENABLED: "true"
      ALLOW_LIVE_SIDE_EFFECTS: "false"
      BLOCK_LIVE_ACTION_EXECUTION: "false"
      ALLOW_XDR_WRITEBACK: "false"

  worker:
    env_file:
      - path: ../.env.llm.audit
        required: true
    environment:
      SOURCE_MODE: mock_xdr
      DISPOSITION_MODE: mock_xdr
      DISPOSITION_ADAPTER_KIND: mock
      TOOL_MODE: mock
      SIMULATION_ENABLED: "true"
      ALLOW_LIVE_SIDE_EFFECTS: "false"
      BLOCK_LIVE_ACTION_EXECUTION: "false"
      ALLOW_XDR_WRITEBACK: "false"

  scheduler-beat:
    env_file:
      - path: ../.env.llm.audit
        required: true
    environment:
      SOURCE_MODE: mock_xdr
      DISPOSITION_MODE: mock_xdr
      DISPOSITION_ADAPTER_KIND: mock
      TOOL_MODE: mock
      SIMULATION_ENABLED: "true"
      ALLOW_LIVE_SIDE_EFFECTS: "false"
      BLOCK_LIVE_ACTION_EXECUTION: "false"
      ALLOW_XDR_WRITEBACK: "false"

  scheduler-worker:
    env_file:
      - path: ../.env.llm.audit
        required: true
    environment:
      SOURCE_MODE: mock_xdr
      DISPOSITION_MODE: mock_xdr
      DISPOSITION_ADAPTER_KIND: mock
      TOOL_MODE: mock
      SIMULATION_ENABLED: "true"
      ALLOW_LIVE_SIDE_EFFECTS: "false"
      BLOCK_LIVE_ACTION_EXECUTION: "false"
      ALLOW_XDR_WRITEBACK: "false"
