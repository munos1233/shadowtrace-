name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # ISSUE-294: keep workflow_dispatch repro runs from cancelling each other.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  contract-drift:
    name: contract-drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify uv.lock
        working-directory: backend
        run: uv lock --check

      - name: Install backend (frozen dev)
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Contract drift gate (ISSUE-112)
        working-directory: backend
        run: uv run --frozen python ../scripts/check_contract_drift.py

      - name: Alembic revision length gate (ISSUE-214)
        working-directory: backend
        run: uv run --frozen python ../scripts/check_migration_revisions.py

      - name: Deterministic export smoke (ISSUE-112)
        working-directory: backend
        run: uv run --frozen pytest tests/test_contracts/test_drift.py -q

  backend-lint:
    name: backend-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify uv.lock
        run: uv lock --check

      - name: Install backend (frozen dev)
        run: uv sync --frozen --extra dev

      - name: Ruff check
        run: uv run --frozen ruff check app tests

      - name: Ruff format check
        run: uv run --frozen ruff format --check app tests

      - name: Mypy
        run: uv run --frozen mypy app

  backend-closure-gates:
    # ISSUE-350: Checks display name must read as Mock plumbing, not product capability.
    # Job id stays backend-closure-gates so `needs:` keys stay stable. GitHub Checks
    # and branch-protection required names follow `name:` (backend-closure-gates-mock).
    name: backend-closure-gates-mock
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: shadowtrace
          POSTGRES_PASSWORD: shadowtrace
          POSTGRES_DB: shadowtrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shadowtrace -d shadowtrace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://shadowtrace:shadowtrace@localhost:5432/shadowtrace
      REDIS_URL: redis://localhost:6379/0
      # ISSUE-350: pin Mock LLM. Live glm is a separate reasoning card (nightly/manual
      # via EVAL_REQUIRE_LLM_QUALITY=1 / --require-llm-quality; not this PR job).
      LLM_MODE: mock
      # ISSUE-347: adversarial closure profile — scorecard visibility, not P0 blocking.
      OUTPUT_QUALITY_BLOCKING: "false"
      QUALITY_JUDGE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify uv.lock
        run: uv lock --check

      - name: Install backend (frozen dev)
        run: uv sync --frozen --extra dev

      - name: ISSUE-261 production and adversarial closure gates (Mock LLM plumbing)
        # ISSUE-350: green here is Mock plumbing + golden/scripted paths, not Live
        # reasoning and not EntitySet containment-coverage proof (ISSUE-328 / Live card).
        run: |
          production_rc=0
          adversarial_rc=0
          uv run --frozen pytest \
            tests/integration/test_production_full_loop_disposition.py \
            -m integration -v --tb=short -o addopts= \
            --junitxml=issue-261-production.xml || production_rc=$?
          uv run --frozen pytest \
            tests/adversarial/test_agent_adversarial_full_loop.py \
            -m adversarial_audit -v --tb=short -o addopts= \
            --junitxml=issue-261-adversarial.xml || adversarial_rc=$?
          if [ "${production_rc}" -ne 0 ] || [ "${adversarial_rc}" -ne 0 ]; then
            exit 1
          fi

      - name: Upload ISSUE-261 closure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-261-closure-diagnostics
          path: |
            backend/issue-261-production.xml
            backend/issue-261-adversarial.xml
            backend/tests/integration/artifacts/latest_production_disposition_audit.json
            backend/tests/adversarial/artifacts/latest_full_loop_audit.json
          if-no-files-found: error

  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    # ISSUE-356 / run 31917018845: default pytest+coverage hit the old 35m job wall
    # (step 00:22:15→00:57:06, canceled). After the split, run 31921298064 finished
    # the default suite in 35:20 (2120s). 45m is that measured wall + ~10m headroom.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: shadowtrace
          POSTGRES_PASSWORD: shadowtrace
          POSTGRES_DB: shadowtrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shadowtrace -d shadowtrace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://shadowtrace:shadowtrace@localhost:5432/shadowtrace
      REDIS_URL: redis://localhost:6379/0
      # Non-hidden data file: upload-artifact@v4 drops .* unless include-hidden-files.
      COVERAGE_FILE: coverage-data
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify uv.lock
        run: uv lock --check

      - name: Install backend (frozen dev)
        run: uv sync --frozen --extra dev

      # ISSUE-371 / #1043: non-eager Celery worker smoke lives in nightly only
      # (pyproject addopts excludes ``nightly``; see test_celery_redelivery_matrix).
      - name: Pytest with coverage (ISSUE-267)
        run: >
          uv run --frozen pytest --cov=app --cov-report=term
          --cov-report=xml:coverage.xml
          --junitxml=junit-default.xml
          --durations=25 --durations-min=0.5

      - name: Classify default-suite JUnit failures
        if: always()
        run: >
          uv run --frozen python scripts/summarize_pytest_junit.py
          junit-default.xml --github-summary

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-junit-default
          path: backend/junit-default.xml
          if-no-files-found: error

      - name: Upload coverage workspace for gates job
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-workspace
          path: |
            backend/coverage-data
            backend/coverage.xml
          if-no-files-found: error

  backend-test-gates:
    name: backend-test-gates
    needs: backend-test
    runs-on: ubuntu-latest
    # ISSUE-356: coverage fail-under + 3× timing retest + random-order retest.
    # Historically ~8–12m when the suite fit in one job; own budget avoids starving
    # gates after a long default-suite run.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: shadowtrace
          POSTGRES_PASSWORD: shadowtrace
          POSTGRES_DB: shadowtrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shadowtrace -d shadowtrace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://shadowtrace:shadowtrace@localhost:5432/shadowtrace
      REDIS_URL: redis://localhost:6379/0
      COVERAGE_FILE: coverage-data
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify uv.lock
        run: uv lock --check

      - name: Install backend (frozen dev)
        run: uv sync --frozen --extra dev

      - name: Download coverage workspace from backend-test
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage-workspace
          path: backend

      - name: Assert coverage data file landed
        run: test -f coverage-data && test -f coverage.xml

      - name: ISSUE-055 orchestration coverage gate
        run: >
          uv run --frozen coverage report
          --include='app/orchestration/*,app/agents/super_agent.py'
          --fail-under=75

      - name: Repeat critical timing tests under coverage
        run: |
          for attempt in 1 2 3; do
            echo "Timing test pass ${attempt}/3"
            uv run --frozen pytest \
              tests/test_tools/test_verify_tools.py::test_verification_waits_for_job_and_delayed_projection \
              tests/test_tools/test_verify_tools.py::test_pending_projection_timeout_is_not_reported_as_effect_failure \
              tests/test_tools/test_verify_tools.py::test_delayed_projection_becomes_visible_after_clock_advance \
              --cov=app --cov-append --cov-report=term \
              --cov-report=xml:coverage.xml \
              --junitxml="junit-timing-${attempt}.xml" \
              --durations=10
          done

      - name: Upload timing JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-junit-timing
          path: |
            backend/junit-timing-1.xml
            backend/junit-timing-2.xml
            backend/junit-timing-3.xml
          if-no-files-found: error

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: error

      - name: Clean-service random-order retest (ISSUE-267)
        env:
          SHADOWTRACE_TEST_SHUFFLE_SEED: "267"
        run: |
          uv run --frozen python - <<'PY'
          import asyncio
          import os
          from sqlalchemy.ext.asyncio import async_sessionmaker, create_async_engine
          from sqlalchemy.pool import NullPool
          from app.core.redis_client import RedisClient
          from tests.test_support.db_isolation import (
              clear_shadowtrace_redis_keys,
              truncate_business_tables,
          )

          async def _reset() -> None:
              engine = create_async_engine(os.environ["DATABASE_URL"], poolclass=NullPool)
              factory = async_sessionmaker(bind=engine, expire_on_commit=False, autoflush=False)
              redis = RedisClient(url=os.environ["REDIS_URL"])
              try:
                  await truncate_business_tables(factory)
                  await clear_shadowtrace_redis_keys(redis)
              finally:
                  await redis.aclose()
                  await engine.dispose()

          asyncio.run(_reset())
          PY
          uv run --frozen pytest \
            tests/test_services/test_detection_scope_service.py \
            tests/test_services/test_event_disposition_service.py \
            tests/test_services/test_context_store.py \
            tests/test_contracts/test_event_context_schema_export.py \
            -q --tb=short --junitxml=junit-random-retest.xml

      - name: Upload random-retest JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-junit-random-retest
          path: backend/junit-random-retest.xml
          if-no-files-found: error

  backend-system-test:
    name: backend-system-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: shadowtrace
          POSTGRES_PASSWORD: shadowtrace
          POSTGRES_DB: shadowtrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shadowtrace -d shadowtrace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://shadowtrace:shadowtrace@localhost:5432/shadowtrace
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify uv.lock
        run: uv lock --check

      - name: Install backend (frozen dev)
        run: uv sync --frozen --extra dev

      - name: ISSUE-086 system quality gate
        run: uv run --frozen pytest tests/system/ -m system -v --tb=short -o addopts=

  backend-regression-test:
    name: backend-regression-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: shadowtrace
          POSTGRES_PASSWORD: shadowtrace
          POSTGRES_DB: shadowtrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shadowtrace -d shadowtrace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://shadowtrace:shadowtrace@localhost:5432/shadowtrace
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify uv.lock
        run: uv lock --check

      - name: Install backend (frozen dev)
        run: uv sync --frozen --extra dev

      - name: ISSUE-087 regression golden-path gate
        run: uv run --frozen pytest tests/regression/ -m regression -v --tb=short -o addopts=

  backend-evaluation:
    name: backend-evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: shadowtrace
          POSTGRES_PASSWORD: shadowtrace
          POSTGRES_DB: shadowtrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shadowtrace -d shadowtrace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # ISSUE-337: same redis:7 + health-cmd as backend-test. Promotion comparison
      # needs REDIS_URL for EventContextStore; without Redis the ingestion
      # redis_client fixture skips that slice instead of running it.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://shadowtrace:shadowtrace@localhost:5432/shadowtrace
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify uv.lock
        run: uv lock --check

      - name: Install backend (frozen dev)
        run: uv sync --frozen --extra dev

      - name: Apply migrations
        run: uv run --frozen python -m alembic upgrade head

      - name: ISSUE-105 evaluation pipeline tests
        run: uv run --frozen pytest tests/evaluation/ -m evaluation -v --tb=short -o addopts=

      - name: Run mock evaluation (artifact-only)
        run: |
          uv run --frozen python -m scripts.run_evaluation \
            --output "${GITHUB_WORKSPACE}/artifacts/evaluation/ci_run.json" \
            --code-sha "${GITHUB_SHA}" \
            --seed 42 \
            --threshold-manifest "${GITHUB_WORKSPACE}/data/evaluation/shadowtrace_demo_v1/threshold_manifest.json" \
            --compare-baseline "${GITHUB_WORKSPACE}/data/evaluation/shadowtrace_demo_v1/baseline_artifact.json"

      - name: Run security/knowledge evaluation (report-only baseline)
        run: |
          uv run --frozen python -m scripts.run_evaluation \
            --dataset-dir "${GITHUB_WORKSPACE}/data/evaluation/security_knowledge_v1" \
            --output "${GITHUB_WORKSPACE}/artifacts/evaluation/security_knowledge_ci_run.json" \
            --code-sha "${GITHUB_SHA}" \
            --seed 42 \
            --threshold-manifest "${GITHUB_WORKSPACE}/data/evaluation/security_knowledge_v1/threshold_manifest.json" \
            --compare-baseline "${GITHUB_WORKSPACE}/data/evaluation/security_knowledge_v1/baseline_artifact.json"

      - name: Run agentic/coordination evaluation (report-only baseline)
        run: |
          uv run --frozen python -m scripts.run_evaluation \
            --dataset-dir "${GITHUB_WORKSPACE}/data/evaluation/agentic_coordination_v1" \
            --output "${GITHUB_WORKSPACE}/artifacts/evaluation/agentic_coordination_ci_run.json" \
            --code-sha "${GITHUB_SHA}" \
            --seed 42 \
            --threshold-manifest "${GITHUB_WORKSPACE}/data/evaluation/agentic_coordination_v1/threshold_manifest.json" \
            --compare-baseline "${GITHUB_WORKSPACE}/data/evaluation/agentic_coordination_v1/baseline_artifact.json"

      - name: Run mock detection evaluation (required gate)
        run: |
          uv run --frozen python -m scripts.run_detection_evaluation \
            --dataset-dir "${GITHUB_WORKSPACE}/data/evaluation/detection_shadow_v1" \
            --output "${GITHUB_WORKSPACE}/artifacts/evaluation/detection_ci_run.json" \
            --code-sha "${GITHUB_SHA}" \
            --seed 42 \
            --threshold-manifest "${GITHUB_WORKSPACE}/data/evaluation/detection_shadow_v1/threshold_manifest.json" \
            --compare-baseline "${GITHUB_WORKSPACE}/data/evaluation/detection_shadow_v1/baseline_artifact.json"

      - name: Run mock detection fail-closed evaluation (observe gate)
        if: success() || failure()
        run: |
          uv run --frozen python -m scripts.run_detection_evaluation \
            --dataset-dir "${GITHUB_WORKSPACE}/data/evaluation/detection_shadow_v1_fail_closed" \
            --output "${GITHUB_WORKSPACE}/artifacts/evaluation/detection_fail_closed_ci_run.json" \
            --code-sha "${GITHUB_SHA}" \
            --seed 42 \
            --threshold-manifest "${GITHUB_WORKSPACE}/data/evaluation/detection_shadow_v1_fail_closed/threshold_manifest.json" \
            --compare-baseline "${GITHUB_WORKSPACE}/data/evaluation/detection_shadow_v1_fail_closed/baseline_artifact.json" \
            --allow-gate-fail

      - name: Upload non-detection evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-run-artifact
          path: |
            artifacts/evaluation/ci_run.json
            artifacts/evaluation/security_knowledge_ci_run.json
            artifacts/evaluation/agentic_coordination_ci_run.json
          if-no-files-found: error

      - name: Upload required detection artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detection-evaluation-run-artifact
          path: |
            artifacts/evaluation/detection_ci_run.json
          if-no-files-found: error

      - name: Upload detection fail-closed observe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detection-fail-closed-observe-artifact
          path: |
            artifacts/evaluation/detection_fail_closed_ci_run.json
          if-no-files-found: error

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (Vitest, ISSUE-111)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify production build has no inlined dev auth token (ISSUE-221)
        run: pnpm run verify:production-build

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: shadowtrace-ci-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_PORT: "5432"
      REDIS_PORT: "6379"
      BACKEND_PORT: "8000"
      FRONTEND_PORT: "5173"
      MOCK_XDR_PORT: "8100"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Docker build context guards (ISSUE-278)
        run: |
          set -euo pipefail
          python scripts/check_docker_build_context.py --validate-dockerignore
          python scripts/check_docker_build_context.py --context backend-root --seed-dirty
          python scripts/check_docker_build_context.py --context frontend --seed-dirty

      - name: Build and validate stack
        run: |
          set -euo pipefail
          compose() {
            docker compose \
              --project-name "${COMPOSE_PROJECT_NAME}" \
              -f "${GITHUB_WORKSPACE}/infra/docker-compose.yml" \
              "$@"
          }
          cleanup() {
            status=$?
            trap - EXIT
            if (( status != 0 )); then
              compose ps -a || true
              compose logs --no-color postgres redis backend frontend || true
            fi
            compose down --volumes --remove-orphans || true
            exit "${status}"
          }
          trap cleanup EXIT

          compose build

          backend_image="$(
            python scripts/check_docker_build_context.py \
              --resolve-compose-image backend \
              --project-name "${COMPOSE_PROJECT_NAME}" \
              --compose-file "${GITHUB_WORKSPACE}/infra/docker-compose.yml"
          )"
          python scripts/check_docker_build_context.py --inspect-image "${backend_image}"

          compose up -d --wait --wait-timeout 180

          for service in postgres redis mock-xdr backend frontend; do
            container_id="$(compose ps -q "${service}")"
            if [[ -z "${container_id}" ]]; then
              echo "${service} container is missing"
              exit 1
            fi
            health="$(
              docker inspect \
                --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' \
                "${container_id}"
            )"
            if [[ "${health}" != "healthy" ]]; then
              echo "${service} is not healthy: ${health}"
              exit 1
            fi
          done

          compose ps
          curl --fail --show-error --silent \
            "http://127.0.0.1:${BACKEND_PORT}/api/v1/health" >/dev/null
          curl --fail --show-error --silent \
            "http://127.0.0.1:${FRONTEND_PORT}/health" >/dev/null
          curl --fail --show-error --silent \
            "http://127.0.0.1:${MOCK_XDR_PORT}/mock-xdr/v1/health" >/dev/null

  # ISSUE-077: optional Playwright e2e — manual only, does not block main pipeline.
  frontend-e2e:
    name: frontend-e2e
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: shadowtrace-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_PORT: "5432"
      REDIS_PORT: "6379"
      BACKEND_PORT: "8000"
      FRONTEND_PORT: "5173"
      MOCK_XDR_PORT: "8100"
      VITE_API_BASE_URL: http://localhost:8000/api/v1
      VITE_SOCKET_URL: http://localhost:8000
      VITE_DEV_AUTH_TOKEN: e2e-token
      VITE_AUTH_SUBJECT: e2e-operator
      VITE_APPROVER_DISPLAY: E2E Operator
      E2E_FRONTEND_URL: http://127.0.0.1:5173
      E2E_BACKEND_URL: http://127.0.0.1:8000/api/v1
      E2E_AUTH_TOKEN: e2e-token
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Bring up full stack
        run: |
          set -euo pipefail
          docker compose \
            --project-name "${COMPOSE_PROJECT_NAME}" \
            -f "${GITHUB_WORKSPACE}/infra/docker-compose.yml" \
            up -d --build --wait --wait-timeout 180
          # Defense in depth: entrypoint migrates, but assert schema is ready.
          docker compose \
            --project-name "${COMPOSE_PROJECT_NAME}" \
            -f "${GITHUB_WORKSPACE}/infra/docker-compose.yml" \
            exec -T backend python -m alembic upgrade head
          curl --fail --show-error --silent \
            "http://127.0.0.1:${BACKEND_PORT}/api/v1/health" >/dev/null
          curl --fail --show-error --silent \
            "http://127.0.0.1:${FRONTEND_PORT}/health" >/dev/null

      - name: Run Playwright e2e
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-artifacts
          path: |
            frontend/e2e/test-results
            frontend/e2e/playwright-report
          if-no-files-found: warn

      - name: Tear down stack
        if: always()
        run: |
          docker compose \
            --project-name "${COMPOSE_PROJECT_NAME}" \
            -f "${GITHUB_WORKSPACE}/infra/docker-compose.yml" \
            down --volumes --remove-orphans || true
