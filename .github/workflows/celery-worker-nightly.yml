name: celery-worker-nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: celery-worker-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  redelivery-matrix:
    name: redelivery-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: shadowtrace
          POSTGRES_PASSWORD: shadowtrace
          POSTGRES_DB: shadowtrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shadowtrace -d shadowtrace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://shadowtrace:shadowtrace@localhost:5432/shadowtrace
      REDIS_URL: redis://localhost:6379/0
      TASK_MODE: celery
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend (frozen dev)
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: ISSUE-117 Phase B redelivery matrix (unit/integration)
        run: >
          uv run --frozen pytest
          tests/test_core/test_celery_delivery.py
          tests/test_core/test_celery_health.py
          tests/test_tasks/test_celery_redelivery_matrix.py
          tests/test_api/test_celery_investigation.py
          tests/test_tasks/test_investigation_tasks.py -q

  # Broad Docker smoke remains manual; the focused SIGKILL gate below runs on
  # both the nightly schedule and workflow_dispatch.
  docker-worker-smoke:
    name: docker-worker-smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: shadowtrace-worker-nightly-${{ github.run_id }}
      POSTGRES_PORT: "5432"
      REDIS_PORT: "6379"
      BACKEND_PORT: "8000"
      FRONTEND_PORT: "5173"
      MOCK_XDR_PORT: "8100"
    steps:
      - uses: actions/checkout@v4

      - name: Start stack with Celery worker profile
        run: |
          set -euo pipefail
          make up WORKER=1

      - name: Run celery worker smoke script
        run: bash scripts/celery_worker_smoke.sh

      - name: ISSUE-110 autonomous mock E2E (worker-gated)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://shadowtrace:shadowtrace@127.0.0.1:5432/shadowtrace
          REDIS_URL: redis://127.0.0.1:6379/0
          TASK_MODE: celery
          CELERY_BROKER_URL: redis://127.0.0.1:6379/0
        run: >
          uv run --frozen pytest tests/integration/autonomous_e2e/
          -m autonomous_mock_e2e -v --tb=short

      - name: Tear down stack
        if: always()
        run: |
          docker compose \
            --project-name "${COMPOSE_PROJECT_NAME}" \
            -f "${GITHUB_WORKSPACE}/infra/docker-compose.yml" \
            down --volumes --remove-orphans || true

  worker-sigkill-fault-injection:
    name: worker-sigkill-fault-injection
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CELERY_SIGKILL_PROJECT_NAME: shadowtrace-issue283-${{ github.run_id }}
      CELERY_SIGKILL_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/issue-283
      POSTGRES_PORT: "5432"
      REDIS_PORT: "6379"
      BACKEND_PORT: "8000"
      MOCK_XDR_PORT: "8100"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend (frozen dev)
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: ISSUE-283 real worker SIGKILL/redelivery gate
        run: make autonomous-mock-e2e-worker-sigkill

      - name: Upload ISSUE-283 fault artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-283-sigkill-${{ github.run_id }}
          path: artifacts/issue-283/*.json
          if-no-files-found: error
          retention-days: 30
