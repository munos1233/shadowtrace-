# ShadowTrace frontend — nginx reverse proxy (ISSUE-088)
# Serves the Vite-built static bundle and proxies /api + /socket.io
# to the backend container.

upstream backend_pool {
    ip_hash;  # sticky sessions for Socket.IO multi-worker
    server backend:8000;
}

upstream mock_xdr_pool {
    server mock-xdr:8100;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # Health check (no access log noise)
    # ------------------------------------------------------------------
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ------------------------------------------------------------------
    # Backend API reverse proxy
    # ------------------------------------------------------------------
    location /api {
        proxy_pass http://backend_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ------------------------------------------------------------------
    # Socket.IO reverse proxy (WebSocket upgrade support)
    # ------------------------------------------------------------------
    location /socket.io {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # ------------------------------------------------------------------
    # Mock XDR API reverse proxy (standalone service)
    # ------------------------------------------------------------------
    location /mock-xdr {
        proxy_pass http://mock_xdr_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # ------------------------------------------------------------------
    # SPA fallback — everything else goes to index.html
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
